db_path: "jukebox.db"
rfid:
  # USB OTG keyboard-emulating reader: mode="keyboard"
  # USB OTG serial reader: mode="serial"
  # Built-in Android NFC: mode="nfc_android"
  mode: "nfc_android"
  debounce_seconds: 5.0
  serial_port: "/dev/ttyUSB0"
  baud_rate: 9600
player:
  ytdlp_format: "bestaudio/best"
  # Path to folder containing local audio files (relative to app storage)
  music_folder: "music"
  # Cookie options for YouTube (pick ONE):
  # Option 1: Browser name — only works on desktop
  cookies_from_browser: ""
  # Option 2: Path to a Netscape-format cookies.txt file
  cookies_file: "cookies.txt"
ui:
  resolution: [1920, 1200]
  fullscreen: true
  fps: 30
